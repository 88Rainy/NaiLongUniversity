<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1e8" />
  <meta name="description" content="奶龙正在大笑，倒计时结束后自动跳转。" />
  <title>三明学院</title>
  <script>window.__nailongPageOpenedAt = performance.now();</script>
  <link rel="preload" href="assets/mascot-sprite.png?v=20261111f" as="image" type="image/png" fetchpriority="high" />
  <link rel="preload" href="assets/nailong-edge-transparent.png" as="image" type="image/png" />

<body class="grad-028 mobile-page">
  <main class="page-shell">
<h1>&nbsp;&nbsp;欢迎来到福建奶龙学院官网！</h1>
    <h1>猜猜看10秒后会发生什么</h1> 
    <section class="showcase" id="showcase" aria-label="点击奶龙开始 10 秒倒计时">
      <div class="mascot-wrap" id="mascotWrap" role="button" tabindex="0" aria-label="点击奶龙开始播放声音、动画和倒计时">
        <img
          class="mascot mascot-poster"
          id="mascot"
          src="assets/mascot-laugh-poster.png"
          alt="正在捧腹大笑的奶龙"
          width="240"
          height="240"
          draggable="false"
        />
        <div class="mascot-frames" id="mascotFrames" aria-hidden="true"></div>
        <span class="mascot-play-hint" aria-hidden="true">👆 点击奶龙开始</span>
      </div>

      <div class="countdown-card" id="countdownCard" aria-label="10 秒倒计时">
        <span class="countdown-label" id="countdownLabel">等待开始</span>
        <strong class="countdown-digit" id="countdownDigit" aria-live="assertive">10</strong>
        <span class="countdown-unit">秒</span>
        <div class="countdown-track" aria-hidden="true"><span id="countdownProgress"></span></div>
      </div>
    </section>

    <div class="page-actions">
      <button class="sound-button" id="soundButton" type="button" hidden>开启声音（点击页面也可开启）</button>
      <button class="replay-button" id="replayButton" type="button" aria-label="刷新页面并重新开始 10 秒倒计时">↻ 重新播放</button>
      <a class="manual-link" id="manualLink" href="https://www.fjsmu.edu.cn" rel="noopener noreferrer">没有跳转？点击这里</a>
    </div>
  </main>

  <div class="edge-mascots" aria-hidden="true">
    <div class="edge-mascot edge-mascot--left" style="--row: 0;">
      <div class="edge-mascot__pose">
